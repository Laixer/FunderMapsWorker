; Rehearsal stand-in for DO's connection pools (webservice-pool, api-pool): transaction mode with prepared statements.
[databases]
fundermaps = host=l5-rehearsal port=5432 dbname=fundermaps

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_prepared_statements = 200
default_pool_size = 25
max_client_conn = 300
ignore_startup_parameters = extra_float_digits
admin_users = postgres
