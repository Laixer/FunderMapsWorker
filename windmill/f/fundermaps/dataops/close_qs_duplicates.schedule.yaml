summary: Data Ops — close QuickScan duplicates — Hourly
description: 'Worker #219. Enabled once the variable f/fundermaps/dataops/qs_sweeper_api_key exists.'
args:
  api_key: $var:f/fundermaps/dataops/qs_sweeper_api_key
  close: true
  pg: $res:f/fundermaps/managed_pg
  s3: $res:f/fundermaps/s3
cron_version: v2
email: yorick@laixer.com
enabled: true
is_flow: false
no_flow_overlap: false
on_failure_exact: false
on_failure_times: 1
on_recovery_extra_args: {}
on_recovery_times: 1
on_success_extra_args: {}
schedule: 0 20 * * * *
script_path: f/fundermaps/dataops/close_qs_duplicates
timezone: Europe/Amsterdam
ws_error_handler_muted: false
