summary: Export Tileset to Archive
description: 'Exports one maplayer bundle (`maplayer.<tileset>`) from PostGIS to
  GeoPackage with ogr2ogr and uploads it as one streaming PUT to
  `fundermaps-archive/<prefix>/YYYY/mon/DD/<tileset>.gpkg`, then converts that
  file to GeoParquet with DuckDB and uploads it next to it as
  `<tileset>.parquet` (a failed copy does not fail the export). Needs the
  worker image with GDAL and DuckDB (windmill-worker/ in FunderMapsWorker).
  Test runs use their own prefix.'
lock: '!inline f/fundermaps/mapset/export_tileset.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    db:
      type: object
      description: ''
      format: resource-postgresql
    s3:
      type: object
      description: Spaces credentials; the bucket comes from `bucket`, not the resource
      format: resource-s3
    tileset:
      type: string
      description: maplayer.bundle tileset, e.g. analysis_full
    bucket:
      type: string
      description: ''
      default: fundermaps-archive
    prefix:
      type: string
      description: mapset for the real archive; anything else for a test run
      default: mapset
  required:
    - db
    - s3
    - tileset
