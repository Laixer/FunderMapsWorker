summary: Process Map Tilesets
description: 'Fetches all enabled bundles from maplayer.bundle, then exports each
  tileset sequentially with export_tileset (ogr2ogr → GPKG →
  fundermaps-archive/mapset/YYYY/mon/DD/). Runs after the daily risk model
  refresh. The queue worker (fundermaps-worker-0) is no longer involved since
  the 2026-10-12 cut-over (Worker #147).'
value:
  modules:
    - id: a
      summary: Get enabled bundles
      value:
        type: rawscript
        content: '!inline get_enabled_bundles.inline_script.pg.sql'
        input_transforms:
          database:
            type: static
            value: $res:f/fundermaps/managed_pg
        lock: ''
        language: postgresql
    - id: b
      summary: Process each tileset
      value:
        type: forloopflow
        modules:
          - id: c
            summary: Export tileset to archive
            value:
              type: script
              input_transforms:
                bucket:
                  type: static
                  value: fundermaps-archive
                db:
                  type: static
                  value: $res:f/fundermaps/managed_pg
                prefix:
                  type: static
                  value: mapset
                s3:
                  type: static
                  value: $res:f/fundermaps/s3
                tileset:
                  type: javascript
                  expr: flow_input.iter.value
              path: f/fundermaps/mapset/export_tileset
            retry:
              constant:
                attempts: 1
                seconds: 60
        iterator:
          type: javascript
          expr: results.a.map(r => r.tileset)
        parallel: false
        skip_failures: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
  required: []
