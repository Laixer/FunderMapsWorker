# Martin tileserver — FunderMaps dynamic vector tiles.
#
# Serves GET /buildings/{z}/{x}/{y} from the maplayer.buildings(z,x,y)
# function source (FunderMapsWorker sql/model/create_building_tiles.sql),
# which reads the nightly-rebuilt flat table maplayer.building_tiles.
#
# DATABASE_URL is injected as an App Platform secret and connects as the
# fundermaps_tileserver role: read-only, CONNECTION LIMIT 5,
# statement_timeout 15s — a tile stampede can never starve the billable
# webservice. pool_size must stay below the role's connection limit.

listen_addresses: '0.0.0.0:3000'

# Built-in map preview stays off: Martin has no auth, so enabling it exposes
# a browse UI to the world. To eyeball tiles, run Martin locally with this
# config against the read-only role instead.
web_ui: disable

# In-memory tile cache. Data changes once a night, so hit rates are high;
# tiles are served from here in ~1ms after first render.
cache_size_mb: 512

postgres:
  connection_string: '${DATABASE_URL}'
  pool_size: 4
  # Auto-publish (scoped to maplayer, functions only) instead of an explicit
  # source entry: Martin only merges the TileJSON fragment from the function
  # COMMENT (minzoom/maxzoom/bounds/vector_layers — see
  # sql/model/create_building_tiles.sql) for auto-published sources.
  # Explicitly configured sources ignore the comment, which left the TileJSON
  # without vector_layers and broke every comment-driven client (the web UI
  # renders nothing without it). The tile-shaped functions in the schema are
  # maplayer.buildings(z,x,y) and maplayer.building_cluster(z,x,y); tables
  # stay unpublished so the *_tiles source tables are not exposed directly.
  auto_publish:
    tables: false
    functions:
      from_schemas: maplayer
