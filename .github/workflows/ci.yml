name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Unit tests
        env:
          # src/config.ts runs envSchema.parse(process.env) at module load —
          # any test transitively importing it triggers the parse, even if
          # the test itself opens zero connections. These are dummy values.
          FUNDERMAPS_DATABASE_HOST: localhost
          FUNDERMAPS_DATABASE_PASSWORD: ci-test-not-used
          FUNDERMAPS_S3_ENDPOINT: https://ci-test.invalid
          FUNDERMAPS_S3_ACCESS_KEY: ci-test
          FUNDERMAPS_S3_SECRET_KEY: ci-test
        run: bun test
